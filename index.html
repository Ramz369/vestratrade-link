<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Vestratrade</title>
<style>
body { margin:0; min-height:100vh; display:grid; place-items:center; font:14px ui-monospace,Menlo,monospace; background:#080c12; color:#edf1f6; }
.box { text-align:center; line-height:1.9; max-width:36rem; padding:1rem; } .dim { opacity:.55; }
a.btn { display:inline-block; margin:.35rem; padding:.5rem 1rem; border:1px solid #2a3543; border-radius:3px; color:#6fa4d6; text-decoration:none; background:#121924; }
a.btn:hover { border-color:#55677b; }
</style>
</head>
<body>
<div class="box">
  <div><strong>Vestratrade</strong> <span class="dim">terminal</span></div>
  <div id="msg" class="dim">finding a host your network can reach…</div>
  <div><a class="btn" href="https://alliance-weddings-explicit-admitted.trycloudflare.com/unlock/80c2ce9941b5c097a4cc4df36b7f3f79">open (cloudflare)</a><a class="btn" href="https://vestratrade.serveousercontent.com/unlock/80c2ce9941b5c097a4cc4df36b7f3f79?serveo-skip-browser-warning=true">open (fixed host)</a><a class="btn" href="https://4a6f003a3f77a9.lhr.life/unlock/80c2ce9941b5c097a4cc4df36b7f3f79">open (fallback)</a></div>
  <div class="dim">cloudflare: alliance-weddings-explicit-admitted.trycloudflare.com · fixed host: vestratrade.serveousercontent.com · fallback: 4a6f003a3f77a9.lhr.life</div>
</div>
<script>
const HOSTS = [["https://alliance-weddings-explicit-admitted.trycloudflare.com", "https://alliance-weddings-explicit-admitted.trycloudflare.com/unlock/80c2ce9941b5c097a4cc4df36b7f3f79", "cloudflare"], ["https://vestratrade.serveousercontent.com", "https://vestratrade.serveousercontent.com/unlock/80c2ce9941b5c097a4cc4df36b7f3f79?serveo-skip-browser-warning=true", "fixed host"], ["https://4a6f003a3f77a9.lhr.life", "https://4a6f003a3f77a9.lhr.life/unlock/80c2ce9941b5c097a4cc4df36b7f3f79", "fallback"]];
(async () => {
  const msg = document.getElementById("msg");
  for (const [host, target, label] of HOSTS) {
    const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 4000);
    try {
      await fetch(host + "/api/health", { mode: "no-cors", cache: "no-store", signal: ctl.signal });
      clearTimeout(timer);
      msg.textContent = "opening via " + label;
      location.replace(target);
      return;
    } catch (e) {
      clearTimeout(timer);
      msg.textContent = label + " not reachable from here, trying the next host…";
    }
  }
  msg.textContent = "no host answered from your network; the buttons above try each directly";
})();
</script>
</body>
</html>
